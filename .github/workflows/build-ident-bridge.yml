name: Build IdentBridge EXE

on:
  push:
    branches: [main]
    paths:
      - "ident-bridge/**"
      - ".github/workflows/build-ident-bridge.yml"
  pull_request:
    paths:
      - "ident-bridge/**"
      - ".github/workflows/build-ident-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ident-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build IdentBridge.exe
        run: pyinstaller --noconfirm IdentBridge.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdentBridge-windows
          path: ident-bridge/dist/IdentBridge.exe
          if-no-files-found: error

      - name: Publish EXE into repo (release/)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        working-directory: ident-bridge
        run: |
          mkdir -p release
          cp -f dist/IdentBridge.exe release/IdentBridge.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/IdentBridge.exe
          if git diff --staged --quiet; then
            echo "EXE unchanged, skip commit"
          else
            git commit -m "chore: update IdentBridge.exe (build ${{ github.run_number }}) [skip ci]"
            git push
          fi

      - name: Create GitHub Release (on main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ident-bridge-build-${{ github.run_number }}
          name: IdentBridge Windows build ${{ github.run_number }}
          files: ident-bridge/dist/IdentBridge.exe
          generate_release_notes: true
