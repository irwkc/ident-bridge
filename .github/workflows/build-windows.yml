name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build IdentBridge.exe
        run: pyinstaller --noconfirm IdentBridge.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdentBridge-windows
          path: dist/IdentBridge.exe
          if-no-files-found: error

      - name: Create GitHub Release (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IdentBridge Windows build ${{ github.run_number }}
          files: dist/IdentBridge.exe
          generate_release_notes: true
