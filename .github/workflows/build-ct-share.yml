name: Build CT Share EXE

on:
  push:
    branches: [main]
    paths:
      - "ct-share/**"
      - ".github/workflows/build-ct-share.yml"
  pull_request:
    paths:
      - "ct-share/**"
      - ".github/workflows/build-ct-share.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ct-share
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build EXEs
        run: |
          pyinstaller --noconfirm CTShareAdmin.spec
          pyinstaller --noconfirm CTShareDoctor.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CTShare-windows
          path: |
            ct-share/dist/CTShareAdmin.exe
            ct-share/dist/CTShareDoctor.exe
          if-no-files-found: error

      - name: Publish EXE into repo (release/)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        working-directory: ct-share
        run: |
          mkdir -p release
          cp -f dist/CTShareAdmin.exe release/CTShareAdmin.exe
          cp -f dist/CTShareDoctor.exe release/CTShareDoctor.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/CTShareAdmin.exe release/CTShareDoctor.exe
          if git diff --staged --quiet; then
            echo "EXE unchanged, skip commit"
          else
            git commit -m "chore: update CT Share EXE (build ${{ github.run_number }}) [skip ci]"
            git push
          fi

      - name: Create GitHub Release (on main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ct-share-build-${{ github.run_number }}
          name: CT Share Windows build ${{ github.run_number }}
          files: |
            ct-share/dist/CTShareAdmin.exe
            ct-share/dist/CTShareDoctor.exe
          generate_release_notes: true
